version: '3.1'

# This tests the CommandBox Docker Secrets implementation
# To test:
# BUILD_IMAGE_DOCKERFILE=Dockerfile BUILD_IMAGE_TAG=ortussolutions/commandbox docker compose -f docker-compose.secret-test.yml up --build

services:

  sut:
    image: ${TEST_IMAGE:-docker-commandbox-sut:latest}
    build:
      context: .
      dockerfile: "./${BUILD_IMAGE_DOCKERFILE}"
      args :
        - COMMANDBOX_VERSION
        - BASE_IMAGE_ARG
    environment:
      - SOME_VAR=foo
      - TEST_DOCKER_SECRET=<<SECRET:test_docker_secret>>
      - BOX_SERVER_CFCONFIGFILE=/opt/test/myConfigs.json
      - IMAGE_TESTING_IN_PROGRESS=true
    volumes:
      - test-app:/srv/app
      - ./build/tests/myConfigs.json:/opt/test/myConfigs.json:ro
      - ./build:/opt/build:ro
    secrets:
      - test_docker_secret
    command: /opt/build/tests/test.secrets.sh

volumes:
  test-app:

secrets:
  test_docker_secret:
    file: ./build/tests/secrets/test_docker_secret