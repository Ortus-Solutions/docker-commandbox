name: Release

on:
  push:
    branches:
      - main
      - development

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      base-matrix: ${{ steps.base.outputs.json }}
      engine-matrix: ${{ steps.engine.outputs.json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Load base matrix
        id: base
        run: |
          {
            echo 'json<<EOF'
            cat .github/matrix/base.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Load engine matrix
        id: engine
        run: |
          {
            echo 'json<<EOF'
            cat .github/matrix/engine.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build-base-images-amd64:
    runs-on: ubuntu-latest
    needs: prepare-matrix
    timeout-minutes: 210
    env:
      BUILD_IMAGE_DOCKERFILE: ${{ matrix.BUILD_IMAGE_DOCKERFILE }}
      TEST_IMAGE: docker-commandbox-sut:${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      COMPOSE_PROJECT_NAME: commandbox-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      DOCKER_IMAGE: ortussolutions/commandbox
      BUILD_PLATFORM: linux/amd64
      PUSH_PLATFORM: linux/amd64
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.base-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize diagnostics path
        run: echo "RELEASE_DIAGNOSTICS_DIR=$RUNNER_TEMP/release-diagnostics" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Setup Base Image Builds
        id: setup
        env:
          BUILD_IMAGE_TAGS: ${{ matrix.BUILD_IMAGE_TAGS }}
        run: |
          COMMANDBOX_VERSION=$(jq -r '.commandboxVersion' version.json)
          IFS=',' read -ra TAG_ARRAY <<< "$BUILD_IMAGE_TAGS"
          echo "BUILD_CACHE_SCOPE=base-${TAG_ARRAY[0]}-amd64" >> "$GITHUB_ENV"
          echo "COMMANDBOX_VERSION=${COMMANDBOX_VERSION}" >> "$GITHUB_ENV"
          echo "BASE_IMAGE_ARG=" >> "$GITHUB_ENV"

      - name: DockerHub Login
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build native test image
        timeout-minutes: 60
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: bash build/test-release.sh build

      - name: Test built image
        timeout-minutes: 30
        run: bash build/test-release.sh integration

      - name: Test Docker secrets
        timeout-minutes: 15
        run: bash build/test-release.sh secrets

      - name: Build and push amd64 by digest
        if: github.event_name != 'pull_request'
        timeout-minutes: 90
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform "$PUSH_PLATFORM" \
            --output "type=image,name=${DOCKER_IMAGE},push-by-digest=true,push=true" \
            --provenance=false \
            --cache-from "type=gha,scope=${BUILD_CACHE_SCOPE}" \
            --cache-to "type=gha,scope=${BUILD_CACHE_SCOPE},mode=max,ignore-error=true" \
            --file "$BUILD_IMAGE_DOCKERFILE" \
            --build-arg COMMANDBOX_VERSION="$COMMANDBOX_VERSION" \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            .
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")
          printf '%s' "$digest" > "$RUNNER_TEMP/digest.txt"
          echo "Pushed ${DOCKER_IMAGE}@${digest}"

      - name: Upload amd64 digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: base-amd64-digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digest.txt
          if-no-files-found: error
          retention-days: 1

      - name: Collect failure diagnostics
        if: ${{ failure() }}
        timeout-minutes: 5
        run: bash build/test-release.sh diagnostics

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ env.RELEASE_DIAGNOSTICS_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up test containers
        if: ${{ always() }}
        timeout-minutes: 3
        run: bash build/test-release.sh cleanup

  build-base-images-arm64:
    runs-on: ubuntu-24.04-arm
    needs: prepare-matrix
    timeout-minutes: 210
    env:
      BUILD_IMAGE_DOCKERFILE: ${{ matrix.BUILD_IMAGE_DOCKERFILE }}
      TEST_IMAGE: docker-commandbox-sut:${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      COMPOSE_PROJECT_NAME: commandbox-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      DOCKER_IMAGE: ortussolutions/commandbox
      BUILD_PLATFORM: linux/arm64
      PUSH_PLATFORM: linux/arm64/v8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.base-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize diagnostics path
        run: echo "RELEASE_DIAGNOSTICS_DIR=$RUNNER_TEMP/release-diagnostics" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Setup Base Image Builds
        id: setup
        env:
          BUILD_IMAGE_TAGS: ${{ matrix.BUILD_IMAGE_TAGS }}
        run: |
          COMMANDBOX_VERSION=$(jq -r '.commandboxVersion' version.json)
          IFS=',' read -ra TAG_ARRAY <<< "$BUILD_IMAGE_TAGS"
          echo "BUILD_CACHE_SCOPE=base-${TAG_ARRAY[0]}-arm64" >> "$GITHUB_ENV"
          echo "COMMANDBOX_VERSION=${COMMANDBOX_VERSION}" >> "$GITHUB_ENV"
          echo "BASE_IMAGE_ARG=" >> "$GITHUB_ENV"

      - name: DockerHub Login
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build native test image
        timeout-minutes: 60
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: bash build/test-release.sh build

      - name: Smoke test
        timeout-minutes: 20
        run: bash build/test-release.sh smoke

      - name: Build and push arm64 by digest
        if: github.event_name != 'pull_request'
        timeout-minutes: 90
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform "$PUSH_PLATFORM" \
            --output "type=image,name=${DOCKER_IMAGE},push-by-digest=true,push=true" \
            --provenance=false \
            --cache-from "type=gha,scope=${BUILD_CACHE_SCOPE}" \
            --cache-to "type=gha,scope=${BUILD_CACHE_SCOPE},mode=max,ignore-error=true" \
            --file "$BUILD_IMAGE_DOCKERFILE" \
            --build-arg COMMANDBOX_VERSION="$COMMANDBOX_VERSION" \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            .
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")
          printf '%s' "$digest" > "$RUNNER_TEMP/digest.txt"
          echo "Pushed ${DOCKER_IMAGE}@${digest}"

      - name: Upload arm64 digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: base-arm64-digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digest.txt
          if-no-files-found: error
          retention-days: 1

      - name: Collect failure diagnostics
        if: ${{ failure() }}
        timeout-minutes: 5
        run: bash build/test-release.sh diagnostics

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ env.RELEASE_DIAGNOSTICS_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up test containers
        if: ${{ always() }}
        timeout-minutes: 3
        run: bash build/test-release.sh cleanup

  build-base-manifests:
    runs-on: ubuntu-latest
    needs:
      - prepare-matrix
      - build-base-images-amd64
      - build-base-images-arm64
    timeout-minutes: 60
    env:
      DOCKER_IMAGE: ortussolutions/commandbox
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.base-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: DockerHub Login
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Download amd64 digest
        uses: actions/download-artifact@v4
        with:
          name: base-amd64-digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/amd64

      - name: Download arm64 digest
        uses: actions/download-artifact@v4
        with:
          name: base-arm64-digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/arm64

      - name: Create multi-arch manifest
        if: github.event_name != 'pull_request'
        env:
          BUILD_IMAGE_TAGS: ${{ matrix.BUILD_IMAGE_TAGS }}
        run: |
          IMAGE_VERSION=$(jq -r '.imageVersion' version.json)
          amd64_digest=$(cat "$RUNNER_TEMP/amd64/digest.txt")
          arm64_digest=$(cat "$RUNNER_TEMP/arm64/digest.txt")
          tag_list=$(BUILD_IMAGE_TAGS="$BUILD_IMAGE_TAGS" GITHUB_REF="$GITHUB_REF" IMAGE_VERSION="$IMAGE_VERSION" DOCKER_IMAGE="$DOCKER_IMAGE" bash build/util/compute-tags.sh)
          tag_args=()
          while IFS= read -r tag; do
            [[ -n $tag ]] && tag_args+=(-t "$tag")
          done <<< "$tag_list"
          docker buildx imagetools create "${tag_args[@]}" \
            "${DOCKER_IMAGE}@${amd64_digest}" \
            "${DOCKER_IMAGE}@${arm64_digest}"

  build-engine-images-amd64:
    runs-on: ubuntu-latest
    needs:
      - prepare-matrix
      - build-base-manifests
    timeout-minutes: 210
    env:
      BUILD_IMAGE_DOCKERFILE: ${{ matrix.BUILD_IMAGE_DOCKERFILE }}
      TEST_IMAGE: docker-commandbox-sut:${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      COMPOSE_PROJECT_NAME: commandbox-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      DOCKER_IMAGE: ortussolutions/commandbox
      BUILD_PLATFORM: linux/amd64
      PUSH_PLATFORM: linux/amd64
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.engine-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize diagnostics path
        run: echo "RELEASE_DIAGNOSTICS_DIR=$RUNNER_TEMP/release-diagnostics" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Setup Engine Image Builds
        id: setup
        env:
          BUILD_IMAGE_TAGS: ${{ matrix.BUILD_IMAGE_TAGS }}
          BASE_IMAGE: ${{ matrix.BASE_IMAGE }}
        run: |
          IMAGE_VERSION=$(jq -r '.imageVersion' version.json)
          COMMANDBOX_VERSION=$(jq -r '.commandboxVersion' version.json)
          ACTUAL_BASE_IMAGE=$(BASE_IMAGE="$BASE_IMAGE" GITHUB_REF="$GITHUB_REF" IMAGE_VERSION="$IMAGE_VERSION" bash build/util/resolve-base-image.sh)
          echo "BUILD_CACHE_SCOPE=engine-${BUILD_IMAGE_TAGS}-amd64" >> "$GITHUB_ENV"
          echo "COMMANDBOX_VERSION=${COMMANDBOX_VERSION}" >> "$GITHUB_ENV"
          echo "BASE_IMAGE_ARG=${ACTUAL_BASE_IMAGE}" >> "$GITHUB_ENV"

      - name: DockerHub Login
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build native test image
        timeout-minutes: 60
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: bash build/test-release.sh build

      - name: Test Engine Images
        timeout-minutes: 30
        env:
          TEST_COMMAND: /opt/build/test-engine.sh
        run: bash build/test-release.sh integration

      - name: Build and push amd64 by digest
        if: github.event_name != 'pull_request'
        timeout-minutes: 90
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform "$PUSH_PLATFORM" \
            --pull \
            --output "type=image,name=${DOCKER_IMAGE},push-by-digest=true,push=true" \
            --provenance=false \
            --cache-from "type=gha,scope=${BUILD_CACHE_SCOPE}" \
            --cache-to "type=gha,scope=${BUILD_CACHE_SCOPE},mode=max,ignore-error=true" \
            --file "$BUILD_IMAGE_DOCKERFILE" \
            --build-arg COMMANDBOX_VERSION="$COMMANDBOX_VERSION" \
            --build-arg BASE_IMAGE_ARG="$BASE_IMAGE_ARG" \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            .
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")
          printf '%s' "$digest" > "$RUNNER_TEMP/digest.txt"
          echo "Pushed ${DOCKER_IMAGE}@${digest}"

      - name: Upload amd64 digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: engine-amd64-digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digest.txt
          if-no-files-found: error
          retention-days: 1

      - name: Collect failure diagnostics
        if: ${{ failure() }}
        timeout-minutes: 5
        run: bash build/test-release.sh diagnostics

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ env.RELEASE_DIAGNOSTICS_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up test containers
        if: ${{ always() }}
        timeout-minutes: 3
        run: bash build/test-release.sh cleanup

  build-engine-images-arm64:
    runs-on: ubuntu-24.04-arm
    needs:
      - prepare-matrix
      - build-base-manifests
    timeout-minutes: 210
    env:
      BUILD_IMAGE_DOCKERFILE: ${{ matrix.BUILD_IMAGE_DOCKERFILE }}
      TEST_IMAGE: docker-commandbox-sut:${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      COMPOSE_PROJECT_NAME: commandbox-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      DOCKER_IMAGE: ortussolutions/commandbox
      BUILD_PLATFORM: linux/arm64
      PUSH_PLATFORM: linux/arm64/v8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.engine-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize diagnostics path
        run: echo "RELEASE_DIAGNOSTICS_DIR=$RUNNER_TEMP/release-diagnostics" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Setup Engine Image Builds
        id: setup
        env:
          BUILD_IMAGE_TAGS: ${{ matrix.BUILD_IMAGE_TAGS }}
          BASE_IMAGE: ${{ matrix.BASE_IMAGE }}
        run: |
          IMAGE_VERSION=$(jq -r '.imageVersion' version.json)
          COMMANDBOX_VERSION=$(jq -r '.commandboxVersion' version.json)
          ACTUAL_BASE_IMAGE=$(BASE_IMAGE="$BASE_IMAGE" GITHUB_REF="$GITHUB_REF" IMAGE_VERSION="$IMAGE_VERSION" bash build/util/resolve-base-image.sh)
          echo "BUILD_CACHE_SCOPE=engine-${BUILD_IMAGE_TAGS}-arm64" >> "$GITHUB_ENV"
          echo "COMMANDBOX_VERSION=${COMMANDBOX_VERSION}" >> "$GITHUB_ENV"
          echo "BASE_IMAGE_ARG=${ACTUAL_BASE_IMAGE}" >> "$GITHUB_ENV"

      - name: DockerHub Login
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build native test image
        if: matrix.BUILD_IMAGE_TAGS != 'adobe2023-alpine'
        timeout-minutes: 60
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: bash build/test-release.sh build

      - name: Smoke test
        if: matrix.BUILD_IMAGE_TAGS != 'adobe2023-alpine'
        timeout-minutes: 20
        run: bash build/test-release.sh smoke

      - name: Build and push arm64 by digest
        if: github.event_name != 'pull_request' && matrix.BUILD_IMAGE_TAGS != 'adobe2023-alpine'
        timeout-minutes: 90
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform "$PUSH_PLATFORM" \
            --pull \
            --output "type=image,name=${DOCKER_IMAGE},push-by-digest=true,push=true" \
            --provenance=false \
            --cache-from "type=gha,scope=${BUILD_CACHE_SCOPE}" \
            --cache-to "type=gha,scope=${BUILD_CACHE_SCOPE},mode=max,ignore-error=true" \
            --file "$BUILD_IMAGE_DOCKERFILE" \
            --build-arg COMMANDBOX_VERSION="$COMMANDBOX_VERSION" \
            --build-arg BASE_IMAGE_ARG="$BASE_IMAGE_ARG" \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            .
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")
          printf '%s' "$digest" > "$RUNNER_TEMP/digest.txt"
          echo "Pushed ${DOCKER_IMAGE}@${digest}"

      - name: Upload arm64 digest
        if: github.event_name != 'pull_request' && matrix.BUILD_IMAGE_TAGS != 'adobe2023-alpine'
        uses: actions/upload-artifact@v4
        with:
          name: engine-arm64-digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digest.txt
          if-no-files-found: error
          retention-days: 1

      - name: Collect failure diagnostics
        if: ${{ failure() }}
        timeout-minutes: 5
        run: bash build/test-release.sh diagnostics

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ env.RELEASE_DIAGNOSTICS_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up test containers
        if: ${{ always() }}
        timeout-minutes: 3
        run: bash build/test-release.sh cleanup

  build-engine-manifests:
    runs-on: ubuntu-latest
    needs:
      - prepare-matrix
      - build-engine-images-amd64
      - build-engine-images-arm64
    timeout-minutes: 60
    env:
      DOCKER_IMAGE: ortussolutions/commandbox
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.engine-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: DockerHub Login
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Download amd64 digest
        uses: actions/download-artifact@v4
        with:
          name: engine-amd64-digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/amd64

      - name: Download arm64 digest
        if: matrix.BUILD_IMAGE_TAGS != 'adobe2023-alpine'
        uses: actions/download-artifact@v4
        with:
          name: engine-arm64-digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/arm64

      - name: Create multi-arch manifest
        if: github.event_name != 'pull_request'
        env:
          BUILD_IMAGE_TAGS: ${{ matrix.BUILD_IMAGE_TAGS }}
        run: |
          IMAGE_VERSION=$(jq -r '.imageVersion' version.json)
          amd64_digest=$(cat "$RUNNER_TEMP/amd64/digest.txt")
          sources=("${DOCKER_IMAGE}@${amd64_digest}")
          if [[ "$BUILD_IMAGE_TAGS" != "adobe2023-alpine" ]]; then
            arm64_digest=$(cat "$RUNNER_TEMP/arm64/digest.txt")
            sources+=("${DOCKER_IMAGE}@${arm64_digest}")
          fi
          tag_list=$(BUILD_IMAGE_TAGS="$BUILD_IMAGE_TAGS" GITHUB_REF="$GITHUB_REF" IMAGE_VERSION="$IMAGE_VERSION" DOCKER_IMAGE="$DOCKER_IMAGE" bash build/util/compute-tags.sh)
          tag_args=()
          while IFS= read -r tag; do
            [[ -n $tag ]] && tag_args+=(-t "$tag")
          done <<< "$tag_list"
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

  finalize_release:
    runs-on: ubuntu-latest
    needs: build-engine-manifests
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Load image version
        run: echo "IMAGE_VERSION=$(jq -r '.imageVersion' version.json)" >> "$GITHUB_ENV"

      - name: Finalize changelog
        uses: thomaseizinger/keep-a-changelog-new-release@3.1.0
        with:
          changelogPath: ./changelog.md
          tag: v${{ env.IMAGE_VERSION }}

      - name: Commit changelog
        uses: EndBug/add-and-commit@v11.1.1
        with:
          author_name: Github Actions
          author_email: info@ortussolutions.com
          message: 'Finalized changelog for v${{ env.IMAGE_VERSION }}'
          add: changelog.md

      - name: Create tag
        uses: rickstaa/action-create-tag@v1.7.2
        with:
          tag: v${{ env.IMAGE_VERSION }}
          message: 'Release v${{ env.IMAGE_VERSION }}'
          force_push_tag: true

      - name: Create GitHub Release
        uses: taiki-e/create-gh-release-action@v1.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refs/tags/v${{ env.IMAGE_VERSION }}
          title: ${{ env.IMAGE_VERSION }}
          changelog: changelog.md

  prep_next_release:
    runs-on: ubuntu-latest
    needs: finalize_release
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Bump version
        run: |
          new_version=$(jq -r '.imageVersion' version.json | awk -F. '{print $1"."$2"."($3+1)}')
          jq --arg v "$new_version" '.imageVersion = $v' version.json > version.json.tmp
          mv version.json.tmp version.json
          cat version.json

      - name: Commit version bump
        uses: EndBug/add-and-commit@v11.1.1
        with:
          author_name: Github Actions
          author_email: info@ortussolutions.com
          message: 'Version bump'
          add: version.json
